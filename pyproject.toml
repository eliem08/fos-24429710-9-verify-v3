[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceledger"
version = "0.1.0"
description = "Automated vendor invoice intake, OCR extraction, job costing rules, and P&L spreadsheet reconciler for contractors"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pypdf>=4.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0"
]

[project.scripts]
invoiceledger = "invoiceledger.cli:main"
