[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceledger"
version = "0.1.0"
description = "Automated vendor invoice intake, OCR extraction, job costing rules, and P&L spreadsheet reconciler for contractors"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.51.0",
    "pydantic>=2.13.4",
    "pypdf>=5.0.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "psycopg[binary]>=3.2.13",
    "openpyxl>=3.1.5",
    "boto3>=1.43.37"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.12.0"
]

[project.scripts]
invoiceledger = "invoiceledger.cli:main"
